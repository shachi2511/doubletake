[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doubletake"
version = "0.1.0"
description = "Stop AI agents from repeating side effects (double charges, duplicate emails) after lost replies and pushy follow-ups."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["anthropic>=2.8"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]

[tool.setuptools.packages.find]
include = ["doubletake", "doubletake.*"]
