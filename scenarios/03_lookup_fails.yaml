id: lookup_fails
description: >
  The charge commits but its reply is lost, and the first list_charges call also hangs
  (times out). Later lookups work. One charge is right; asking the user is acceptable.
category: retry
faults:
  lose_reply: {enabled: true, tools: [charge_card], hang_seconds: 30, times: 1}
  lookup_fails: {enabled: true, hang_seconds: 30, times: 1}
turns:
  - charge customer 881 $50
expect: {table: charges, effects: 1, ask_ok: true}
requires_fault_hit: true
